spring:
  application:
    name: transaction-profitshare-service
  datasource:
    url: jdbc:postgresql://localhost:5432/partnership?currentSchema=transactionprofitshare
    username: ${DB_USERNAME:transactionprofitshare_app}
    password: ${DB_PASSWORD:changeme_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  profiles:
    active: local

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upstream:
    vendor-offering-url: ${VENDOR_OFFERING_URL:http://localhost:8081}
    ecosystem-bundle-url: ${ECOSYSTEM_BUNDLE_URL:http://localhost:8082}
    partner-subscription-url: ${PARTNER_SUBSCRIPTION_URL:http://localhost:8083}
