version: "3.9"

# Local development infra only. Mirrors the TDD's RDS PostgreSQL + ElastiCache
# Redis choices (Section 4.2) at a single-node, no-auth-hardening scale suitable
# for a laptop, not for any shared or production environment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: partnership-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: partnership_app
      POSTGRES_PASSWORD: changeme_local_only
      POSTGRES_DB: partnership
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partnership_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: partnership-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: partnership-localstack
    restart: unless-stopped
    environment:
      SERVICES: events,sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-southeast-5
    ports:
      - "4566:4566"
    volumes:
      - ./infra/local/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh
      - localstack_data:/var/lib/localstack

volumes:
  pg_data:
  localstack_data:
