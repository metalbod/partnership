spring:
  application:
    name: ecosystem-bundle-service
  datasource:
    url: jdbc:postgresql://localhost:5432/partnership_ecosystembundle
    username: ${DB_USERNAME:partnership_app}
    password: ${DB_PASSWORD:changeme_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  profiles:
    active: local

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
